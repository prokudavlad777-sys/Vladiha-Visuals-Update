name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Resolve latest Forge 26.3 build
        id: forge
        run: |
          META=$(curl -fsSL https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml || true)
          V=$(echo "$META" | grep -oE '<version>26\.3-[^<]+</version>' | sed -E 's#</?version>##g' | sort -V | tail -1)
          if [ -z "$V" ]; then V="26.3-66.0.10"; fi
          echo "Using Forge $V"
          echo "forge=${V#26.3-}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: gradle build --no-daemon -Pforge_version=${{ steps.forge.outputs.forge }}

      - uses: actions/upload-artifact@v4
        with:
          name: visualpanel-jar
          path: build/libs/*.jar
